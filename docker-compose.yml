# One copy of this runs per client site (compose project = site name), each
# with its own settings in sites/<name>.env and its own data folder.
# deploy/add-site.sh creates a site; deploy/update.sh restarts them all.
services:
  app:
    # Built once by the deploy scripts and shared by every site.
    image: car-rental-app
    pull_policy: never
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?}
    # Only reachable from the Droplet itself — nginx is the public entry point
    # and forwards each domain to its site's port.
    ports:
      - "127.0.0.1:${APP_PORT:?}:8080"
    # This site's SQLite db + uploaded images. Survives rebuilds and restarts.
    volumes:
      - ./data/${SITE:?}:/app/data
