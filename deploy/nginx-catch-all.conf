# Catch-all for requests to a domain no client site claims, for example a new
# client's domain after its DNS points here but before certbot has run.
# Without this, nginx answers those requests with the first client site it
# has, showing (and letting the admin panel edit) that client's database.
# setup-droplet.sh installs this as /etc/nginx/sites-available/catch-all.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Refuse HTTPS without needing a certificate, and close plain-HTTP
    # connections without a response.
    ssl_reject_handshake on;
    return 444;
}
