# nginx site template, one per client. add-site.sh installs a copy as
# /etc/nginx/sites-available/<name> with the domains and port filled in,
# and certbot then adds the HTTPS settings to that copy.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # nginx rejects request bodies over 1 MB by default, which would break
    # image uploads from the admin panel.
    client_max_body_size 20M;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # The Go server handles everything: /api, /uploads and the Vue frontend.
    location / {
        proxy_pass http://127.0.0.1:APP_PORT;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
