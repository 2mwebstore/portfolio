# Deploys to the Droplet on every push to main: SSHes in and runs
# deploy/update.sh, which pulls, rebuilds and restarts every client site.
# Needs the DROPLET_HOST, DROPLET_SSH_KEY and DROPLET_KNOWN_HOSTS repo
# secrets, which deploy/setup-auto-deploy.sh prints.
name: Deploy to Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run deploy/update.sh on the Droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          for name in DROPLET_HOST DROPLET_KNOWN_HOSTS DROPLET_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Run deploy/setup-auto-deploy.sh on the Droplet and add the values it prints under Settings -> Secrets and variables -> Actions -> Secrets -> New repository secret."
              missing=1
            fi
          done
          [ -z "${missing:-}" ] || exit 1
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The Droplet only lets this key run deploy/update.sh, so no command is sent.
          ssh -T -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@$DROPLET_HOST"
